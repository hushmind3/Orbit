name: Orbit preflight
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          for source in server/*.js tests/*.test.js; do node --check "$source"; done
      - name: Test existing Node execution harness
        run: npm test
      - name: Test FastAPI management and webhook routing
        run: |
          python -m pip install -r requirements-control.txt
          python -m unittest discover -s tests_python -p 'test_fastapi.py' -v
      - name: Typecheck and build React/Tailwind management UI
        run: npm run build
