name: Orbit preflight
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Node.js syntax
        run: |
          for source in server/*.js tests/*.test.js; do node --check "$source"; done
      - name: Run regressions
        run: npm test
      - name: Typecheck and build UI
        run: npm run build
